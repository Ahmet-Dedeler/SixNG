[workspace]
resolver = "2"
members = ["crates/sixng-core", "crates/sixng-cli", "crates/sixng-gui"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
debug = 1

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
