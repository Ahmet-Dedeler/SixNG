<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140a2e"/>
      <stop offset="0.7" stop-color="#3a0f55"/>
      <stop offset="1" stop-color="#5a1460"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="0.5" stop-color="#ff9a5a"/>
      <stop offset="1" stop-color="#ff3f8e"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="400" rx="36" fill="url(#bg)"/>
  <g stroke="#ff5ec4" stroke-width="2" opacity="0.18">
    <line x1="0" y1="330" x2="1280" y2="330"/><line x1="0" y1="352" x2="1280" y2="352"/>
    <line x1="0" y1="378" x2="1280" y2="378"/>
  </g>
  <image x="64" y="64" width="272" height="272" xlink:href="sixng_icon.svg"/>
  <text x="392" y="230" font-family="Bahnschrift" font-weight="700" font-size="168" letter-spacing="4"
        fill="url(#word)" filter="url(#glow)">SixNG</text>
  <line x1="398" y1="262" x2="1032" y2="262" stroke="#3ef0ff" stroke-width="4" opacity="0.9"/>
  <text x="398" y="314" font-family="Bahnschrift" font-weight="400" font-size="38" letter-spacing="9"
